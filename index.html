<!doctype html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="style.css" type="text/css" media="screen" charset="utf-8" />
  </head>
  <body>
    <header class="header">
      <img class="header__image" src="./eisenhower-matrix.jpg" alt="The eisenhower matrix" /><a
        class="header__more-link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </header>
    <main class="page">
      <form class="add-task-form" id="add-task">
        <label class="add-task-form__label" for="new-task">Add Item</label>
        <div class="add-task-form__row">
          <input id="new-task" class="add-task-form__input" type="text" /><button class="button add-task-form__button">
            Add
          </button>
        </div>
      </form>
      <section>
        <h1>Todo</h1>
        <ul class="task-list" id="incomplete-tasks">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" /><label class="task-item__label">Pay Bills</label
            ><input type="text" class="task-item__input" /><button
              class="button task-item__button task-item__button--edit"
            >
              Edit</button
            ><button class="button task-item__button task-item__button--delete" aria-label="Delete task">
              <img class="task-item__icon" src="./remove.svg" alt="" />
            </button>
          </li>
          <li class="task-item task-item--edit-mode">
            <input class="task-item__checkbox" type="checkbox" /><label class="task-item__label">Go Shopping</label
            ><input type="text" value="Go Shopping" class="task-item__input" /><button
              class="button task-item__button task-item__button--edit"
            >
              Save</button
            ><button class="button task-item__button task-item__button--delete" aria-label="Delete task">
              <img class="task-item__icon" src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2>Completed</h2>
        <ul class="task-list task-list--completed" id="completed-tasks">
          <li class="task-item">
            <input class="task-item__checkbox" type="checkbox" checked /><label class="task-item__label"
              >See the Doctor</label
            ><input type="text" class="task-item__input" /><button
              class="button task-item__button task-item__button--edit"
            >
              Edit</button
            ><button class="button task-item__button task-item__button--delete" aria-label="Delete task">
              <img class="task-item__icon" src="./remove.svg" alt="" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script type="text/javascript" src="app.js"></script>
  </body>
</html>
